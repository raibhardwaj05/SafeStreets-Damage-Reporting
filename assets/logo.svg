<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Road/Path -->
  <path d="M 20 120 Q 50 100, 80 120 T 140 120" 
        stroke="url(#roadGradient)" 
        stroke-width="8" 
        fill="none" 
        stroke-linecap="round"/>
  <path d="M 20 140 Q 50 120, 80 140 T 140 140" 
        stroke="url(#roadGradient)" 
        stroke-width="8" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Shield/Guard Icon -->
  <path d="M 100 40 L 120 50 L 120 80 Q 120 100, 100 110 Q 80 100, 80 80 L 80 50 Z" 
        fill="url(#shieldGradient)" 
        stroke="#ffffff" 
        stroke-width="3"/>
  
  <!-- Checkmark inside shield -->
  <path d="M 90 75 L 100 85 L 110 70" 
        stroke="#ffffff" 
        stroke-width="4" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Pothole/Crack indicators on road -->
  <circle cx="50" cy="130" r="6" fill="#ef4444" opacity="0.8"/>
  <path d="M 110 125 Q 115 130, 110 135" 
        stroke="#ef4444" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round" 
        opacity="0.8"/>
  
  <!-- Detection rays -->
  <circle cx="100" cy="60" r="25" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3"/>
  <circle cx="100" cy="60" r="35" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.2"/>
</svg>
